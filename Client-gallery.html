<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Vault Gallery — The Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .vault-wrapper {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .vault-title {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-align: center;
            margin-bottom: 40px;
        }
        .vault-login-card {
            max-width: 450px;
            margin: 0 auto;
            background: #0a0a0c;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 45px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8e929b;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            background: #030303;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #fff;
            padding: 14px 18px;
            font-size: 15px;
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
        }
        .vault-btn {
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            width: 100%;
            padding: 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .vault-btn:hover {
            background: transparent;
            color: #fff;
        }
        
        /* Private Photos Matrix Layout */
        .private-archive-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
        }
        .archive-header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 30px;
        }
        .archive-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 36px;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .archive-card {
            background: #0a0a0c;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
            position: relative;
        }
        .archive-card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
        }
        .download-overlay-btn {
            background: rgba(10, 10, 12, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 100%;
            padding: 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-top: none;
        }
        .download-overlay-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">The <span>Studio</span></div>
        <nav>
            <a href="index.html">Identity</a>
            <a href="booking.html">Reserve Slot</a>
            <a href="track.html">Track Order</a>
            <a href="client-gallery.html" class="active">Private Vault</a>
            <a href="admin-login.html" class="admin-btn">Manager Access</a>
        </nav>
    </header>

    <div class="vault-wrapper">
        
        <div class="vault-login-card" id="loginBox">
            <div style="text-align: center; margin-bottom: 30px;">
                <i class="fas fa-key" style="font-size: 30px; color: #818cf8; margin-bottom: 15px;"></i>
                <h2 style="font-family: 'Syne', sans-serif; font-size: 22px; text-transform: uppercase; letter-spacing: 0.5px;">Decrypt Vault</h2>
                <p style="color: #8e929b; font-size: 13px; margin-top: 5px;">Enter your master signature credentials.</p>
            </div>
            
            <form onsubmit="event.preventDefault(); checkPasscode();">
                <div class="form-group">
                    <label>Client Signature Username</label>
                    <input type="text" id="clientUser" placeholder="e.g., rahul_wedding" required>
                </div>
                <div class="form-group">
                    <label>Secret Passcode Matrix</label>
                    <input type="password" id="clientPass" placeholder="Enter password (Use '123')" required>
                </div>
                <button type="submit" class="vault-btn">Unlock Secure Album</button>
            </form>
        </div>

        <div class="private-archive-section" id="photoAlbum">
            <div class="archive-header">
                <h2>Vault Unlocked: <span id="welcomeName" style="color: #818cf8;">Client</span></h2>
                <p style="color: #8e929b; font-size: 14px;">High-resolution master assets are decrypted and available for immediate download.</p>
            </div>
            
            <div class="archive-grid">
                <div class="archive-card">
                    <img src="https://images.unsplash.com/photo-1606800052052-a08af7148866?w=600" alt="Private Asset 1">
                    <button class="download-overlay-btn" onclick="alert('Downloading master asset in source format...')">Download HD Master</button>
                </div>
                <div class="archive-card">
                    <img src="https://images.unsplash.com/photo-1507504038482-7621c6784c36?w=600" alt="Private Asset 2">
                    <button class="download-overlay-btn" onclick="alert('Downloading master asset in source format...')">Download HD Master</button>
                </div>
                <div class="archive-card">
                    <img src="https://images.unsplash.com/photo-1519225495810-7512c696505a?w=600" alt="Private Asset 3">
                    <button class="download-overlay-btn" onclick="alert('Downloading master asset in source format...')">Download HD Master</button>
                </div>
            </div>
        </div>

    </div>

    <script src="js/main.js"></script>
    <script>
        function checkPasscode() {
            const user = document.getElementById('clientUser').value.trim();
            const pass = document.getElementById('clientPass').value;

            if(pass === '123') {
                document.getElementById('welcomeName').innerText = user;
                document.getElementById('loginBox').style.display = 'none';
                
                const album = document.getElementById('photoAlbum');
                album.style.display = 'block';
                setTimeout(() => {
                    album.style.opacity = '1';
                    album.style.transform = 'translateY(0)';
                }, 50);
                
                alert("Signature Verified! Decrypting high-resolution asset pipeline.");
            } else {
                alert("Access Denied! Demo passcode is '123'.");
            }
        }
    </script>
</body>
</html>
