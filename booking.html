<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Your Slot — The Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js"></script>

    <style>
        /* Specially Optimized Layout Configurations for Luxury Card Form */
        .booking-wrapper {
            max-width: 650px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .form-title {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-align: center;
            margin-bottom: 40px;
        }
        .booking-container {
            background: #0a0a0c;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 45px;
            border-radius: 0;
        }
        .form-group {
            margin-bottom: 28px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8e929b;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: #030303;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #fff;
            padding: 14px 18px;
            border-radius: 0;
            font-size: 15px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
        }
        .price-box {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-left: 4px solid #818cf8;
            color: #fff;
            text-align: left;
            padding: 22px;
            font-size: 20px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }
        .otp-box {
            display: none; /* Controlled dynamically via Main Logic Router */
            background: #030303;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            padding: 25px;
            margin-bottom: 30px;
        }
        .submit-btn {
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            width: 100%;
            padding: 16px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background: transparent;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">The <span>Studio</span></div>
        <nav>
            <a href="index.html">Identity</a>
            <a href="booking.html" class="active">Reserve Slot</a>
            <a href="track.html">Track Order</a>
            <a href="client-gallery.html">Private Vault</a>
            <a href="admin-login.html" class="admin-btn">Manager Access</a>
        </nav>
    </header>

    <div class="booking-wrapper">
        <h2 class="form-title">Initiate Reservation</h2>
        
        <div class="booking-container">
            <form id="bookingForm" onsubmit="event.preventDefault();">
                
                <div class="form-group">
                    <label>Full Identity Name</label>
                    <input type="text" id="clientName" placeholder="e.g., Alexander Mercer" required>
                </div>
                
                <div class="form-group">
                    <label>Secure Mobile Network</label>
                    <input type="tel" id="clientPhone" placeholder="+91 XXXXX-XXXXX" required>
                </div>

                <div class="form-group">
                    <label>Digital Mail Address</label>
                    <input type="email" id="clientEmail" placeholder="alex@example.com" required>
                </div>

                <div class="form-group">
                    <label>Target Shoot Date</label>
                    <input type="date" id="shootDate" required>
                </div>

                <div class="form-group">
                    <label>Target Venue / Destination Address</label>
                    <textarea id="shootLocation" rows="3" placeholder="Specify full coordinate address OR type 'In-Studio' for headquarters" required></textarea>
                </div>

                <div class="form-group">
                    <label>Photography Architecture Package</label>
                    <select id="packageSelect" onchange="calculatePrice()" required>
                        <option value="" disabled selected>Select an architectural package</option>
                        <option value="basic">Fine Art Portrait (₹5,000)</option>
                        <option value="standard">Cinematic Pre-Wedding Shoot (₹15,000)</option>
                        <option value="premium">Premium Wedding Legacy Portfolio (₹40,000)</option>
                    </select>
                </div>

                <div class="price-box" id="priceDisplay">
                    ESTIMATED VALUE: ₹0
                </div>

                <div class="otp-box" id="otpSection">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="color: #818cf8;">Security Code Verification (Use '1234' for Demo)</label>
                        <input type="text" id="otpInput" placeholder="Enter 4-Digit Security Key" maxlength="4" style="letter-spacing: 8px; text-align: center; font-size: 18px;">
                        <p style="color: #8e929b; font-size: 11px; margin-top: 8px;"><i class="fas fa-info-circle"></i> Token System: Live simulation active. Code is 1234.</p>
                    </div>
                </div>

                <button type="button" class="submit-btn" id="actionBtn" onclick="requestOTP()">Validate & Request Slot</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
